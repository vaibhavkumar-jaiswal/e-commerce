version: 2

run:
  timeout: 5m
  generated: false
  skip-dirs:
    - docs

linters:
  enable:
    - staticcheck
    - revive
    - dupl
    - errcheck
    - gosec
    - iface
    - lll
    - nestif

  settings:

    dupl:
      threshold: 100
  
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: false
      exclude:
        - fmt\.Print.*
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)

    lll:
      line-length: 140
      tab-width: 1

exclude:
  - "Code generated by swaggo/swag. DO NOT EDIT"
